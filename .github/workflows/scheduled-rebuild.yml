# Fork-only (nachtschatt3n/sure) -- keep out of upstream PRs.
#
# Weekly cache-free rebuild of what the cluster deploys.
#
# The fork's `main` carries exactly the deployed tree (`integration` is merged
# into `main` after every deploy), so this rebuilds `main` HEAD with a freshly
# pulled base image, no build cache and the Dockerfile's `apt-get upgrade`
# (base stage, inherited by the final stage), runs the repo's CI suite and a
# boot smoke test (`/up` against real Postgres + Redis) per architecture, and
# only then publishes:
#
#   ghcr.io/<repo>:sha-<7hex>-b<YYYYMMDD>   immutable, selectable by a Flux ImagePolicy
#   ghcr.io/<repo>:weekly                   moving convenience tag
#
# It NEVER pushes the plain `sha-<40hex>` tag the cluster pins: a pinned tag
# must not change content. A same-day re-run refuses to overwrite its own tag.
name: Scheduled rebuild

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: scheduled-rebuild
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve tag
    if: github.repository == 'nachtschatt3n/sure'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      sha: ${{ steps.r.outputs.sha }}
      tag: ${{ steps.r.outputs.tag }}
      day: ${{ steps.r.outputs.day }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Compute tag
        id: r
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          short="$(git rev-parse --short=7 HEAD)"
          day="$(date -u +%Y%m%d)"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${short}-b${day}" >> "$GITHUB_OUTPUT"
          echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          echo "Rebuilding ${GITHUB_REF_NAME}@${sha} as sha-${short}-b${day}"

      - name: Log in to the container registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing tag
        shell: bash
        env:
          REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.r.outputs.tag }}
        run: |
          if docker buildx imagetools inspect "$REF" >/dev/null 2>&1; then
            echo "::error::$REF already exists; published tags are immutable. Re-run tomorrow or after a new commit."
            exit 1
          fi
          echo "$REF is free"

  ci:
    name: Tests
    needs: [resolve]
    uses: ./.github/workflows/ci.yml

  build:
    name: Build + smoke (${{ matrix.platform }})
    needs: [resolve, ci]
    strategy:
      fail-fast: true
      matrix:
        platform: [amd64, arm64]
        include:
          - platform: amd64
            runs-on: ubuntu-24.04
          - platform: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to the container registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Fresh base (pull) + no cache: every layer, including the base stage's
      # `apt-get upgrade`, is rebuilt from the current upstream base image.
      - name: Build (fresh base, no cache) and load
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          platforms: linux/${{ matrix.platform }}
          pull: true
          no-cache: true
          load: true
          provenance: false
          tags: sure-smoke:local
          build-args: |
            BUILD_COMMIT_SHA=${{ needs.resolve.outputs.sha }}
            OS_PACKAGES_REFRESH=${{ needs.resolve.outputs.day }}

      - name: Smoke test (boot against Postgres + Redis, GET /up)
        shell: bash
        run: |
          set -euo pipefail
          docker network create smoke
          docker run -d --name pg --network smoke \
            -e POSTGRES_USER=sure -e POSTGRES_PASSWORD=sure -e POSTGRES_DB=sure_production \
            postgres:16
          docker run -d --name redis --network smoke redis:7
          for i in $(seq 1 30); do docker exec pg pg_isready -U sure >/dev/null 2>&1 && break; sleep 2; done
          docker run -d --name app --network smoke -p 3000:3000 \
            -e DB_HOST=pg -e POSTGRES_USER=sure -e POSTGRES_PASSWORD=sure -e POSTGRES_DB=sure_production \
            -e REDIS_URL=redis://redis:6379/1 \
            -e SECRET_KEY_BASE="$(openssl rand -hex 64)" \
            -e SELF_HOSTED=true -e RAILS_FORCE_SSL=false -e RAILS_ASSUME_SSL=false \
            sure-smoke:local
          ok=""
          for i in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/up || true)"
            if [ "$code" = "200" ]; then ok=1; break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' app)" != "true" ]; then break; fi
            sleep 3
          done
          docker logs app 2>&1 | tail -40
          docker run --rm --entrypoint cat sure-smoke:local /etc/os-release | head -3
          if [ -z "$ok" ]; then echo "::error::/up did not return 200"; exit 1; fi
          echo "Smoke test passed: /up = 200"

      # Same builder, no --no-cache: reuses the fresh layers just built above.
      - name: Push 'linux/${{ matrix.platform }}' by digest
        id: push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          platforms: linux/${{ matrix.platform }}
          provenance: false
          build-args: |
            BUILD_COMMIT_SHA=${{ needs.resolve.outputs.sha }}
            OS_PACKAGES_REFRESH=${{ needs.resolve.outputs.day }}
          push: true
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},name-canonical=true,push-by-digest=true,oci-mediatypes=true

      - name: Export digest
        shell: bash
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          echo "${DIGEST#sha256:}" > "${RUNNER_TEMP}/digests/digest-${PLATFORM}"

      - name: Upload digest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: rebuild-digest-${{ matrix.platform }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-arch tags
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Download digests
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: ${{ runner.temp }}/digests
          pattern: rebuild-digest-*
          merge-multiple: true

      - name: Log in to the container registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        shell: bash
        env:
          IMG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAG: ${{ needs.resolve.outputs.tag }}
          SHA: ${{ needs.resolve.outputs.sha }}
          DIGESTS_DIR: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.created=$(date -Iseconds)" \
            --annotation "index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --annotation "index:org.opencontainers.image.revision=${SHA}" \
            --annotation "index:org.opencontainers.image.ref.name=${GITHUB_REF_NAME}" \
            --annotation "index:org.opencontainers.image.title=Sure" \
            --tag "${IMG}:${TAG}" \
            --tag "${IMG}:weekly" \
            "${IMG}@sha256:$(<"${DIGESTS_DIR}/digest-amd64")" \
            "${IMG}@sha256:$(<"${DIGESTS_DIR}/digest-arm64")"
          docker buildx imagetools inspect "${IMG}:${TAG}"
          echo "### Published \`${IMG}:${TAG}\` (+ \`weekly\`) from ${SHA}" >> "$GITHUB_STEP_SUMMARY"

  keepalive:
    name: Keep schedule enabled
    needs: [publish]
    if: always() && github.repository == 'nachtschatt3n/sure'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      # GitHub disables scheduled workflows after 60 days without repo activity;
      # re-enabling resets that timer.
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/scheduled-rebuild.yml/enable"
